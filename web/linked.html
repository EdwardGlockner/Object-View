<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObjectView — Linked Views</title>
  </head>
  <body>
    <main class="linked-shell">
      <header class="linked-header">
        <p class="eyebrow">ObjectView</p>
        <h1>Linked scene views</h1>
        <p>Load two scenes below. Click a marker on the left to seek the right view's playback to that marker's <code>time</code>.</p>
      </header>

      <section class="linked-grid">
        <div class="linked-panel">
          <div class="linked-panel-controls">
            <label class="field-label" for="left-path">Left scene</label>
            <div class="inline-row">
              <input id="left-path" type="text" placeholder="e.g. a latent-map.scene.json path" />
              <button id="left-load">Load</button>
            </div>
          </div>
          <div id="left-viewer" class="linked-canvas"></div>
          <p id="left-status" class="linked-status">No scene loaded.</p>
          <ul class="legend-list" id="left-legend"></ul>
        </div>

        <div class="linked-panel">
          <div class="linked-panel-controls">
            <label class="field-label" for="right-path">Right scene</label>
            <div class="inline-row">
              <input id="right-path" type="text" placeholder="e.g. an embodied episode.scene.json path" />
              <button id="right-load">Load</button>
            </div>
          </div>
          <div id="right-viewer" class="linked-canvas"></div>
          <div class="transport-row" id="right-transport" hidden>
            <button id="right-play-pause">Play</button>
            <input id="right-scrub" type="range" min="0" max="1" step="0.001" value="0" />
            <span id="right-time-label" class="time-label">0.0s / 0.0s</span>
          </div>
          <p id="right-status" class="linked-status">No scene loaded.</p>
          <ul class="legend-list" id="right-legend"></ul>
        </div>
      </section>

      <div id="marker-tooltip" class="marker-tooltip linked-tooltip" hidden></div>
    </main>
    <script type="module" src="/src/linked.js"></script>
  </body>
</html>
